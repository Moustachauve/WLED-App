name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (beta -> Open Testing & TestFlight, production -> Play Store & App Store)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production
      version_name:
        description: 'Version name to build (e.g. 8.1.0-beta.1 or 8.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build, sign, and validate Play Store / iOS archive without publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare & Validate Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'illumidel-v')
    runs-on: ubuntu-latest
    environment: illumidel
    outputs:
      track: ${{ steps.meta.outputs.track }}
      is_beta: ${{ steps.meta.outputs.is_beta }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version_name: ${{ steps.meta.outputs.version_name }}
      ios_marketing_version: ${{ steps.meta.outputs.ios_marketing_version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute and validate release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          # 1. Determine track (beta vs production)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRACK="$INPUT_TRACK"
            RAW_VERSION="$INPUT_VERSION_NAME"
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              DRY_RUN="true"
            else
              DRY_RUN="false"
            fi
          else
            RAW_VERSION="${RELEASE_TAG#illumidel-}"
            DRY_RUN="false"
            if [ "$RELEASE_PRERELEASE" = "true" ] || [[ "$RAW_VERSION" == *-* ]]; then
              TRACK="beta"
            else
              TRACK="production"
            fi
          fi

          if [ "$TRACK" = "beta" ]; then
            IS_BETA="true"
          else
            IS_BETA="false"
          fi

          RAW_VERSION="${RAW_VERSION#illumidel-}"
          VERSION_NAME="${RAW_VERSION#v}"
          if [ "$TRACK" = "beta" ] && [[ "$VERSION_NAME" != *-* ]]; then
            VERSION_NAME="${VERSION_NAME}-beta.${RUN_NUMBER}"
          fi
          TAG_NAME="${RELEASE_TAG:-illumidel-v${VERSION_NAME}}"
          IOS_MARKETING_VERSION="${VERSION_NAME%%-*}"

          # 2. Pre-flight check: prevent workflow_dispatch (non-dry-run) from colliding with an existing release or draft
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; then
            EXISTING_MATCH=$(gh release list --limit 50 --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG_NAME\") | .tagName" || true)
            if [ -n "$EXISTING_MATCH" ]; then
              echo "::error::GitHub Release (or pending draft) for $TAG_NAME already exists. Publish the existing draft or choose a new version_name."
              exit 1
            fi
          fi

          # 3. Pre-flight check: verify all required secrets are configured before any platform job starts
          MISSING_SECRETS=()
          for SECRET_VAR in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GOOGLE_PLAY_JSON_KEY \
            IOS_DIST_CERT_BASE64 \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_KEY_P8_BASE64; do
            if [ -z "${!SECRET_VAR:-}" ]; then
              MISSING_SECRETS+=("$SECRET_VAR")
            fi
          done
          if [ "${#MISSING_SECRETS[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${MISSING_SECRETS[*]} (see docs/RELEASING.md)"
            exit 1
          fi

          # 4. Pre-flight check: verify non-empty store changelog exists
          # Keep candidate filenames in sync with `read_plain_changelog` in `fastlane/Fastfile`.
          DIR="fastlane/changelogs"
          if [ ! -s "${DIR}/${VERSION_NAME}.txt" ] && \
             [ ! -s "${DIR}/v${VERSION_NAME}.txt" ] && \
             [ ! -s "${DIR}/${IOS_MARKETING_VERSION}.txt" ] && \
             [ ! -s "${DIR}/v${IOS_MARKETING_VERSION}.txt" ] && \
             [ ! -s "${DIR}/dev.txt" ]; then
            echo "::error::No non-empty changelog found in ${DIR} for ${VERSION_NAME} (or dev.txt)."
            exit 1
          fi

          # 5. Compute monotonically increasing versionCode / CFBundleVersion (base offset 100 + workflow run_number).
          # Note: github.run_number is tied to this workflow file ID; do not rename/delete release.yml without
          # updating the base offset, and use "Re-run failed jobs" rather than "Re-run all jobs" on partial failures.
          VERSION_CODE=$((100 + RUN_NUMBER))

          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "ios_marketing_version=$IOS_MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          {
            echo "### Release Metadata"
            echo "- **Track:** \`$TRACK\`"
            echo "- **Dry Run:** \`$DRY_RUN\`"
            echo "- **Tag:** \`$TAG_NAME\`"
            echo "- **Android Version Name:** \`$VERSION_NAME\`"
            echo "- **iOS Marketing Version:** \`$IOS_MARKETING_VERSION\`"
            echo "- **Build Number / Version Code:** \`$VERSION_CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-android:
    name: Build & Deploy Android (Play Store)
    needs: prepare
    runs-on: ubuntu-latest
    environment: illumidel
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Promote dev.txt changelog in build workspace if needed
        if: needs.prepare.outputs.is_beta == 'false'
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.ios_marketing_version }}
        run: |
          PLAY_CHANGELOG_DIR="fastlane/changelogs"
          if [ -f "$PLAY_CHANGELOG_DIR/dev.txt" ] && [ ! -f "$PLAY_CHANGELOG_DIR/${MARKETING_VERSION}.txt" ]; then
            echo "::warning::fastlane/changelogs/dev.txt was not renamed before tagging; promoting dev.txt -> ${MARKETING_VERSION}.txt for this build."
            mv "$PLAY_CHANGELOG_DIR/dev.txt" "$PLAY_CHANGELOG_DIR/${MARKETING_VERSION}.txt"
            for DEV_LOCALE_FILE in "$PLAY_CHANGELOG_DIR"/dev.*.txt; do
              [ -e "$DEV_LOCALE_FILE" ] || continue
              SUFFIX="${DEV_LOCALE_FILE#"$PLAY_CHANGELOG_DIR/dev"}"
              mv "$DEV_LOCALE_FILE" "$PLAY_CHANGELOG_DIR/${MARKETING_VERSION}${SUFFIX}"
            done
          fi

      - name: Decode Android Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release AAB & APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_ILLUMIDEL_KEY: ${{ secrets.GITHUB_ILLUMIDEL_KEY }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Deploy to Google Play Store via Fastlane
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          PLAY_STORE_TRACK: ${{ needs.prepare.outputs.track }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: bundle exec fastlane android deploy

      - name: Package Signed Release APK
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="Illumidel-v${VERSION_NAME}.apk"

          cp "$APK_SOURCE" "$APK_TARGET"
          sha256sum "$APK_TARGET" > "${APK_TARGET}.sha256"

      - name: Upload Signed Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ needs.prepare.outputs.version_name }}
          path: |
            Illumidel-v${{ needs.prepare.outputs.version_name }}.apk
            Illumidel-v${{ needs.prepare.outputs.version_name }}.apk.sha256
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ steps.keystore.outputs.keystore_path }}"

  release-ios:
    name: Build & Deploy iOS (TestFlight / App Store Connect)
    needs: prepare
    runs-on: xcode-27
    environment: illumidel
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Promote dev.txt changelog in build workspace if needed
        if: needs.prepare.outputs.is_beta == 'false'
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.ios_marketing_version }}
        run: |
          PLAY_CHANGELOG_DIR="fastlane/changelogs"
          if [ -f "$PLAY_CHANGELOG_DIR/dev.txt" ] && [ ! -f "$PLAY_CHANGELOG_DIR/${MARKETING_VERSION}.txt" ]; then
            mv "$PLAY_CHANGELOG_DIR/dev.txt" "$PLAY_CHANGELOG_DIR/${MARKETING_VERSION}.txt"
            for DEV_LOCALE_FILE in "$PLAY_CHANGELOG_DIR"/dev.*.txt; do
              [ -e "$DEV_LOCALE_FILE" ] || continue
              SUFFIX="${DEV_LOCALE_FILE#"$PLAY_CHANGELOG_DIR/dev"}"
              mv "$DEV_LOCALE_FILE" "$PLAY_CHANGELOG_DIR/${MARKETING_VERSION}${SUFFIX}"
            done
          fi

      - name: Assemble Shared Release XCFramework
        env:
          GITHUB_ILLUMIDEL_KEY: ${{ secrets.GITHUB_ILLUMIDEL_KEY }}
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework
          ./gradlew --stop

      - name: Deploy iOS via Fastlane
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_TESTFLIGHT_GROUP: ${{ vars.IOS_TESTFLIGHT_GROUP || 'Beta' }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          if [ "${{ needs.prepare.outputs.is_beta }}" = "true" ]; then
            bundle exec fastlane ios beta
          else
            bundle exec fastlane ios release
          fi

      - name: Upload iOS Build Artifacts (IPA & dSYMs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-${{ needs.prepare.outputs.version_name }}
          path: |
            iosApp/build/Illumidel.ipa
            iosApp/build/Illumidel.app.dSYM.zip
          if-no-files-found: ignore
          retention-days: 30
